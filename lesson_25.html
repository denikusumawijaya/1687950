<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tutoring - Elements & Circumference of a Circle</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .katex { font-size: 1.1em !important; }
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 80% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .animate-fade { animation: fadeIn 0.5s ease-out forwards; }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-pulse-custom { animation: pulse 2s infinite; }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        /* Print Styles */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; font-size: 10pt; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid black; padding: 4px; text-align: left; }
            .no-print { display: none; }
        }
        .lang-id { font-size: 0.85em; color: #6b7280; font-style: italic; display: block; margin-top: 2px; }
        .option-btn { transition: all 0.2s; }
        .option-btn:hover { transform: translateX(5px); }
        .correct-opt { background-color: #d1fae5 !important; border-color: #10b981 !important; }
        .wrong-opt { background-color: #fee2e2 !important; border-color: #ef4444 !important; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <!-- Navbar Left -->
    <nav id="sidebar" class="w-72 bg-gray-800 text-white flex flex-col shadow-lg z-10 overflow-y-auto no-print">
        <div class="p-4 border-b border-gray-700">
            <h1 class="text-xl font-bold text-green-400">MATH TUTORING</h1>
            <p class="text-sm text-gray-400">by Deni</p>
        </div>
        <div class="p-4 flex-1">
            <ul id="nav-list" class="space-y-2 text-sm">
                <!-- Generated by JS -->
            </ul>
        </div>
        <div class="p-4 border-t border-gray-700">
            <button onclick="resetAllProgress()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded flex items-center justify-center gap-2 transition">
                <i class="fas fa-redo"></i> Reset All Progress
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white p-4 shadow-sm flex justify-between items-center no-print">
            <div>
                <h2 id="section-title" class="text-xl font-bold text-gray-800"></h2>
                <p id="slide-counter" class="text-sm text-gray-500"></p>
            </div>
            <div class="flex gap-2">
                <button onclick="prevSlide()" id="btn-prev" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 transition flex items-center gap-1"><i class="fas fa-chevron-left"></i> Prev</button>
                <button onclick="nextSlide()" id="btn-next" class="px-4 py-2 bg-green-500 hover:bg-green-600 rounded text-white transition flex items-center gap-1">Next <i class="fas fa-chevron-right"></i></button>
            </div>
        </header>
        <div id="content-area" class="flex-1 overflow-y-auto p-8 bg-gray-50">
            <!-- Slide content injected here -->
        </div>
    </main>

    <!-- Print Area (Hidden) -->
    <div id="print-area" class="hidden"></div>

    <!-- KaTeX JS -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script>
        // --- STATE MANAGEMENT ---
        let currentSectionIdx = 0;
        let currentSlideIdx = 0;
        let appState = JSON.parse(localStorage.getItem('circleLessonState')) || {};

        function saveState() { localStorage.setItem('circleLessonState', JSON.stringify(appState)); }

        function resetAllProgress() {
            if(confirm('Are you sure you want to reset all progress?')) {
                appState = {};
                saveState();
                renderSlide();
            }
        }

        // --- COURSE DATA (Will be populated in subsequent parts) ---
        const courseStructure = [];
        
        // Helper to add sections
        function addSection(id, title, time, icon) {
            courseStructure.push({ id, title, time, icon, slides: [] });
        }

        // Helper to add slides
        function addSlide(type, contentHtml, exerciseData = null) {
            const section = courseStructure[courseStructure.length - 1];
            const slideId = `${section.id}-${section.slides.length}`;
            section.slides.push({ id: slideId, type, contentHtml, exerciseData });
        }

        // Helper for bilingual text
        function t(en, id) {
            return `<span class="font-medium text-gray-800">${en}</span><span class="lang-id">${id}</span>`;
        }

        // Helper for Math
        function m(math) {
            return `\\(${math}\\)`;
        }

        // --- CONTENT DEFINITION (PART 1) ---
        
        // 0. HOME
        addSection('home', 'Home', '', 'fa-house');
        addSlide('theory', `
            <div class="text-center mb-6 animate-fade">
                <i class="fas fa-chalkboard-teacher text-5xl text-green-500 mb-4"></i>
                <h2 class="text-3xl font-bold text-gray-800">MATH TUTORING by Deni</h2>
                <p class="lang-id" style="display:block; font-size:1rem; font-style:normal; color:#4b5563;">Bimbingan Belajar Matematika oleh Deni</p>
            </div>
            <div class="bg-blue-50 p-6 rounded-lg border border-blue-200 animate-fade" style="animation-delay: 0.2s">
                <h3 class="font-bold text-blue-800 mb-2 flex items-center gap-2"><i class="fas fa-circle-info"></i> Topic:</h3>
                ${t('Elements and Circumference of a Circle', 'Unsur-unsur dan Keliling Lingkaran')}
            </div>
            <div class="mt-6 bg-white p-6 rounded-lg shadow-sm border border-gray-200 animate-fade" style="animation-delay: 0.4s">
                <h3 class="font-bold text-gray-800 mb-3 flex items-center gap-2"><i class="fas fa-list-check"></i> Class Rules:</h3>
                <ul class="space-y-3 text-gray-700">
                    <li class="flex items-start gap-2"><i class="fas fa-comments text-green-500 mt-1"></i> ${t('Take turns speaking clearly.', 'Berbicara secara bergantian dengan jelas.')}</li>
                    <li class="flex items-start gap-2"><i class="fas fa-hand text-yellow-500 mt-1"></i> ${t('Ask permission if you need to leave the class.', 'Meminta izin jika ingin meninggalkan kelas.')}</li>
                    <li class="flex items-start gap-2"><i class="fas fa-video text-blue-500 mt-1"></i> ${t('Turn on camera and microphone when necessary.', 'Menyalakan kamera dan microphone jika diperlukan.')}</li>
                </ul>
            </div>
        `);

        // 1. SPIRAL REVIEW
        addSection('sec1', 'Spiral Review Warm-up', '00:00-00:10', 'fa-brain');
        
        // Sec 1 - Theory 1
        addSlide('theory', `
            <div class="flex items-center gap-4 mb-4">
                <div class="p-3 bg-purple-100 rounded-full"><i class="fas fa-superscript text-2xl text-purple-600"></i></div>
                <h2 class="text-2xl font-bold text-gray-800">${t('Algebraic Expressions Review', 'Review Ekspresi Aljabar')}</h2>
            </div>
            <p class="mb-4">${t('Before we dive into circles, let\'s warm up our algebra brains! An algebraic expression combines numbers (constants), variables, and operations.', 'Sebelum kita masuk ke lingkaran, mari kita panaskan otak aljabar kita! Ekspresi aljabar menggabungkan angka (konstanta), variabel, dan operasi.')}</p>
            <div class="bg-yellow-50 p-4 rounded-lg border-l-4 border-yellow-500 mb-4">
                <p class="font-bold text-yellow-800 mb-1"><i class="fas fa-lightbulb"></i> Key Terms:</p>
                <ul class="list-disc list-inside text-yellow-900">
                    <li>${t('<strong>Variable:</strong> A symbol for an unknown number (e.g., x, y).', '<strong>Variabel:</strong> Simbol untuk bilangan yang tidak diketahui (misalnya, x, y).')}</li>
                    <li>${t('<strong>Coefficient:</strong> The number multiplying the variable.', '<strong>Koefisien:</strong> Angka yang mengalikan variabel.')}</li>
                    <li>${t('<strong>Constant:</strong> A fixed number on its own.', '<strong>Konstanta:</strong> Angka tetap sendiri.')}</li>
                </ul>
            </div>
            <p>${t('For example, in ' + m('7y - 12') + ': Variable is ' + m('y') + ', Coefficient is ' + m('7') + ', Constant is ' + m('-12') + '.', 'Sebagai contoh, di ' + m('7y - 12') + ': Variabelnya ' + m('y') + ', Koefisiennya ' + m('7') + ', Konstantanya ' + m('-12') + '.')}</p>
        `);

        // Sec 1 - Ex 1,2,3
        addSlide('exercise', null, {
            q: t('Translate into algebra: "5 more than three times a number x"', 'Ubah menjadi aljabar: "5 lebihnya dari tiga kali suatu bilangan x"'),
            type: 'mc',
            options: [
                { text: m('3x + 5'), correct: true },
                { text: m('5x + 3'), correct: false },
                { text: m('3(x + 5)'), correct: false },
                { text: m('5 + x^3'), correct: false }
            ],
            explanation: t('"Three times x" is ' + m('3x') + '. "5 more than" means adding 5 to it, resulting in ' + m('3x + 5') + '.', '"Tiga kali x" adalah ' + m('3x') + '. "5 lebihnya" berarti menambahkan 5 kepadanya, menghasilkan ' + m('3x + 5') + '.')
        });
        addSlide('exercise', null, {
            q: t('Translate into algebra: "The price of 4 pizzas minus a 15,000 discount". Use ' + m('p') + ' for pizza price.', 'Ubah menjadi aljabar: "Harga 4 pizza dikurangi diskon 15.000". Gunakan ' + m('p') + ' untuk harga pizza.'),
            type: 'mc',
            options: [
                { text: m('4p - 15000'), correct: true },
                { text: m('4(p - 15000)'), correct: false },
                { text: m('p - 15000 + 4'), correct: false },
                { text: m('15000 - 4p'), correct: false }
            ],
            explanation: t('4 pizzas cost ' + m('4p') + '. Minus the discount gives ' + m('4p - 15000') + '.', '4 pizza harganya ' + m('4p') + '. Dikurangi diskon menjadi ' + m('4p - 15000') + '.')
        });
        addSlide('exercise', null, {
            q: t('In the expression ' + m('7y - 12') + ', what is the constant?', 'Dalam ekspresi ' + m('7y - 12') + ', mana yang disebut konstanta?'),
            type: 'mc',
            options: [
                { text: m('-12'), correct: true },
                { text: m('7'), correct: false },
                { text: m('y'), correct: false },
                { text: m('12'), correct: false }
            ],
            explanation: t('A constant is a term without a variable. Here, ' + m('-12') + ' stands alone.', 'Konstanta adalah suku tanpa variabel. Di sini, ' + m('-12') + ' berdiri sendiri.')
        });

        // Sec 1 - Theory 2
        addSlide('theory', `
            <div class="flex items-center gap-4 mb-4">
                <div class="p-3 bg-indigo-100 rounded-full"><i class="fas fa-code text-2xl text-indigo-600"></i></div>
                <h2 class="text-2xl font-bold text-gray-800">${t('Evaluating Expressions', 'Mengevaluasi Ekspresi')}</h2>
            </div>
            <p class="mb-4">${t('If we know the value of the variable, we can evaluate the expression by substituting the number.', 'Jika kita tahu nilai variabel, kita bisa mengevaluasi ekspresi dengan mengganti angka tersebut.')}</p>
            <div class="bg-gray-100 p-4 rounded-lg font-mono mb-4">
                ${t('Evaluate ' + m('3x + 5') + ' if ' + m('x = 2') + ': <br> ' + m('3(2) + 5 = 6 + 5 = 11'), 'Evaluasi ' + m('3x + 5') + ' jika ' + m('x = 2') + ': <br> ' + m('3(2) + 5 = 6 + 5 = 11'))}
            </div>
        `);

        // Sec 1 - Ex 4,5,6
        addSlide('exercise', null, {
            q: t('Evaluate ' + m('4p - 15000') + ' if ' + m('p = 50000') + '.', 'Evaluasi ' + m('4p - 15000') + ' jika ' + m('p = 50000') + '.'),
            type: 'mc',
            options: [
                { text: m('185000'), correct: true },
                { text: m('35000'), correct: false },
                { text: m('200000'), correct: false },
                { text: m('145000'), correct: false }
            ],
            explanation: t(m('4(50000) - 15000 = 200000 - 15000 = 185000') + '.', m('4(50000) - 15000 = 200000 - 15000 = 185000') + '.')
        });
        addSlide('exercise', null, {
            q: t('In the term ' + m('-8z') + ', what is the coefficient?', 'Pada suku ' + m('-8z') + ', berapa koefisiennya?'),
            type: 'mc',
            options: [
                { text: m('-8'), correct: true },
                { text: m('8'), correct: false },
                { text: m('z'), correct: false },
                { text: m('-z'), correct: false }
            ],
            explanation: t('The coefficient is the number part of the term, including the sign. So it is ' + m('-8') + '.', 'Koefisien adalah bagian angka dari suku, termasuk tandanya. Jadi nilainya ' + m('-8') + '.')
        });
        addSlide('exercise', null, {
            q: t('Which of the following is an algebraic expression?', 'Manakah yang merupakan ekspresi aljabar?'),
            type: 'mc',
            options: [
                { text: t(m('2x - 5'), m('2x - 5')), correct: true },
                { text: t(m('2 = 1 + 1'), m('2 = 1 + 1')), correct: false },
                { text: t(m('15'), m('15')), correct: false }
            ],
            explanation: t('An expression contains variables and does not have an equals sign. ' + m('2x-5') + ' fits this.', 'Ekspresi mengandung variabel dan tidak memiliki tanda sama dengan. ' + m('2x-5') + ' cocok dengan ini.')
        });

        // Sec 1 - Theory 3
        addSlide('theory', `
            <div class="flex items-center gap-4 mb-4">
                <div class="p-3 bg-pink-100 rounded-full"><i class="fas fa-puzzle-piece text-2xl text-pink-600"></i></div>
                <h2 class="text-2xl font-bold text-gray-800">${t('Combining Like Terms', 'Menggabungkan Suku Sejenis')}</h2>
            </div>
            <p class="mb-4">${t('Like terms have the same variable raised to the same power. We can combine them by adding or subtracting their coefficients.', 'Suku sejenis memiliki variabel yang sama dengan pangkat yang sama. Kita bisa menggabungkannya dengan menambah atau mengurangi koefisiennya.')}</p>
            <div class="bg-gray-100 p-4 rounded-lg font-mono">
                ${t('Example: ' + m('3x + 5x = (3+5)x = 8x'), 'Contoh: ' + m('3x + 5x = (3+5)x = 8x'))}
            </div>
        `);

        // Sec 1 - Ex 7,8,9,10
        addSlide('exercise', null, {
            q: t('Simplify: ' + m('4y + 9y'), 'Sederhanakan: ' + m('4y + 9y')),
            type: 'mc',
            options: [
                { text: m('13y'), correct: true },
                { text: m('13y^2'), correct: false },
                { text: m('36y'), correct: false },
                { text: m('9y'), correct: false }
            ],
            explanation: t('Add the coefficients: ' + m('4 + 9 = 13') + ', so the answer is ' + m('13y') + '.', 'Tambahkan koefisien: ' + m('4 + 9 = 13') + ', jadi jawabannya ' + m('13y') + '.')
        });
        addSlide('exercise', null, {
            q: t('Simplify: ' + m('12a - 5a'), 'Sederhanakan: ' + m('12a - 5a')),
            type: 'mc',
            options: [
                { text: m('7a'), correct: true },
                { text: m('7'), correct: false },
                { text: m('17a'), correct: false },
                { text: m('-7a'), correct: false }
            ],
            explanation: t('Subtract the coefficients: ' + m('12 - 5 = 7') + ', so the answer is ' + m('7a') + '.', 'Kurangkan koefisien: ' + m('12 - 5 = 7') + ', jadi jawabannya ' + m('7a') + '.')
        });
        addSlide('exercise', null, {
            q: t('Identify the variable in: ' + m('100 - 5x'), 'Tentukan variabel pada: ' + m('100 - 5x')),
            type: 'mc',
            options: [
                { text: m('x'), correct: true },
                { text: m('5'), correct: false },
                { text: m('100'), correct: false },
                { text: m('-5'), correct: false }
            ],
            explanation: t('The letter representing an unknown value is ' + m('x') + '.', 'Huruf yang mewakili nilai tak diketahui adalah ' + m('x') + '.')
        });
        addSlide('exercise', null, {
            q: t('If ' + m('3a + 5 = 20') + ', what is the value of ' + m('3a') + '?', 'Jika ' + m('3a + 5 = 20') + ', berapa nilai ' + m('3a') + '?'),
            type: 'mc',
            options: [
                { text: m('15'), correct: true },
                { text: m('20'), correct: false },
                { text: m('5'), correct: false },
                { text: m('25'), correct: false }
            ],
            explanation: t('Subtract 5 from both sides: ' + m('3a = 20 - 5 = 15') + '.', 'Kurangi 5 dari kedua sisi: ' + m('3a = 20 - 5 = 15') + '.')
        });

        // --- CONTENT DEFINITION (PART 2) ---

        // 2. INTRODUCTION & REAL-WORLD CONNECTION
        addSection('sec2', 'Introduction & Real-World', '00:10-00:15', 'fa-globe');
        
        // Sec 2 - Theory 1
        addSlide('theory', `
            <div class="flex items-center gap-4 mb-4">
                <div class="p-3 bg-sky-100 rounded-full"><i class="fas fa-bicycle text-2xl text-sky-600"></i></div>
                <h2 class="text-2xl font-bold text-gray-800">${t('Why are Wheels Round?', 'Mengapa Roda Berbentuk Bulat?')}</h2>
            </div>
            <div class="flex flex-col md:flex-row gap-6 items-center mb-4">
                <div class="flex-1">
                    <p class="mb-3">${t('Imagine designing a wheel for a super-fast racing bike. Why a circle? Because every point on the edge is exactly the same distance from the center!', 'Bayangkan merancang roda sepeda balap super cepat. Kenapa lingkaran? Karena setiap titik di pinggirnya memiliki jarak yang sama persis dari pusat!')}</p>
                    <p>${t('This constant distance keeps the axle (center) at a steady height, ensuring a smooth ride.', 'Jarak yang konstan ini membuat poros (pusat) tetap pada ketinggian yang stabil, memastikan perjalanan yang mulus.')}</p>
                </div>
                <div class="w-40 h-40 flex-shrink-0 animate-pulse-custom">
                    <svg viewBox="0 0 100 100" class="w-full h-full text-sky-500 drop-shadow-md">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="4"/>
                        <circle cx="50" cy="50" r="5" fill="currentColor"/>
                        <line x1="50" y1="50" x2="50" y2="5" stroke="currentColor" stroke-width="2" stroke-dasharray="4"/>
                        <line x1="50" y1="50" x2="85" y2="25" stroke="currentColor" stroke-width="2" stroke-dasharray="4"/>
                        <line x1="50" y1="50" x2="95" y2="50" stroke="currentColor" stroke-width="2" stroke-dasharray="4"/>
                    </svg>
                </div>
            </div>
        `);

        // Sec 2 - Ex 1,2,3
        addSlide('exercise', null, {
            q: t('What property of a circle makes it ideal for wheels?', 'Sifat apa dari lingkaran yang membuatnya ideal untuk roda?'),
            type: 'mc',
            options: [
                { text: t('Constant distance from center to edge', 'Jarak konstan dari pusat ke tepi'), correct: true },
                { text: t('It has corners', 'Memiliki sudut'), correct: false },
                { text: t('The diameter is always changing', 'Diameter selalu berubah'), correct: false },
                { text: t('It is flat', 'Berbentuk datar'), correct: false }
            ],
            explanation: t('The constant distance (radius) ensures the vehicle doesn\'t bounce up and down.', 'Jarak yang konstan (jari-jari) memastikan kendaraan tidak berguncang naik turun.')
        });
        addSlide('exercise', null, {
            q: t('If a wheel wasn\'t perfectly round, what would happen to the ride?', 'Jika roda tidak sempurna bulat, apa yang akan terjadi pada perjalanan?'),
            type: 'mc',
            options: [
                { text: t('It would be bumpy', 'Akan terasa berguncang'), correct: true },
                { text: t('It would be faster', 'Akan lebih cepat'), correct: false },
                { text: t('It would use less fuel', 'Akan lebih hemat bahan bakar'), correct: false },
                { text: t('Nothing would change', 'Tidak ada yang berubah'), correct: false }
            ],
            explanation: t('An imperfect circle has varying radii, causing the center to move up and down.', 'Lingkaran yang tidak sempurna memiliki jari-jari yang berbeda-beda, menyebabkan pusat bergerak naik turun.')
        });
        addSlide('exercise', null, {
            q: t('The boundary of a circle is called its...', 'Batasi dari lingkaran disebut...'),
            type: 'mc',
            options: [
                { text: t('Circumference', 'Keliling'), correct: true },
                { text: t('Area', 'Luas'), correct: false },
                { text: t('Diameter', 'Diameter'), correct: false },
                { text: t('Radius', 'Jari-jari'), correct: false }
            ],
            explanation: t('The perimeter or the total length of the boundary is the circumference.', 'Keliling atau panjang total batas lingkaran adalah keliling.')
        });

        // Sec 2 - Theory 2
        addSlide('theory', `
            <div class="flex items-center gap-4 mb-4">
                <div class="p-3 bg-teal-100 rounded-full"><i class="fas fa-tire text-2xl text-teal-600"></i></div>
                <h2 class="text-2xl font-bold text-gray-800">${t('Anatomy of a Wheel', 'Anatomi Roda')}</h2>
            </div>
            <p class="mb-4">${t('For a bicycle tire, the rubber strip that wraps around the wheel corresponds exactly to the <strong>circumference</strong> of the circle.', 'Untuk ban sepeda, strip karet yang melilit roda sesuai persis dengan <strong>keliling</strong> lingkaran.')}</p>
            <div class="bg-teal-50 p-4 rounded-lg border-l-4 border-teal-500">
                <p class="font-bold text-teal-800 mb-1"><i class="fas fa-cog"></i> Real-World Connection:</p>
                <p class="text-teal-900">${t('Manufacturers must calculate the circumference precisely to know exactly how much rubber is needed for the tire!', 'Produsen harus menghitung keliling dengan tepat untuk mengetahui persis berapa banyak karet yang dibutuhkan untuk ban!')}</p>
            </div>
        `);

        // Sec 2 - Ex 4,5,6
        addSlide('exercise', null, {
            q: t('What does the circumference of a wheel represent in real life?', 'Apa yang diwakili oleh keliling roda dalam kehidupan nyata?'),
            type: 'mc',
            options: [
                { text: t('The length of the rubber tire', 'Panjang karet ban'), correct: true },
                { text: t('The size of the hub', 'Ukuran poros'), correct: false },
                { text: t('The thickness of the spokes', 'Ketebalan jari-jari roda'), correct: false },

        // --- UI & NAVIGATION LOGIC ---
        function buildNav() {
            const navList = document.getElementById('nav-list');
            navList.innerHTML = '';
            courseStructure.forEach((sec, sIdx) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="flex items-center gap-2 p-2 rounded cursor-pointer hover:bg-gray-700 transition ${currentSectionIdx === sIdx ? 'bg-gray-700 text-green-400' : 'text-gray-300'}" onclick="jumpToSection(${sIdx})">
                        <i class="fas ${sec.icon} w-5 text-center"></i>
                        <div class="flex-1 truncate">
                            <div class="font-medium text-xs">${sec.title}</div>
                            ${sec.time ? `<div class="text-[10px] opacity-60">${sec.time}</div>` : ''}
                        </div>
                    </div>
                `;
                navList.appendChild(li);
            });
        }

        function jumpToSection(idx) {
            currentSectionIdx = idx;
            currentSlideIdx = 0;
            renderSlide();
        }

        function nextSlide() {
            const sec = courseStructure[currentSectionIdx];
            if(currentSlideIdx < sec.slides.length - 1) {
                currentSlideIdx++;
            } else if(currentSectionIdx < courseStructure.length - 1) {
                currentSectionIdx++;
                currentSlideIdx = 0;
            }
            renderSlide();
        }

        function prevSlide() {
            if(currentSlideIdx > 0) {
                currentSlideIdx--;
            } else if(currentSectionIdx > 0) {
                currentSectionIdx--;
                currentSlideIdx = courseStructure[currentSectionIdx].slides.length - 1;
            }
            renderSlide();
        }

        function renderSlide() {
            buildNav();
            const sec = courseStructure[currentSectionIdx];
            const slide = sec.slides[currentSlideIdx];
            
            document.getElementById('section-title').innerText = sec.title;
            document.getElementById('slide-counter').innerText = `Slide ${currentSlideIdx + 1} / ${sec.slides.length}`;
            
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '';

            const container = document.createElement('div');
            container.className = 'max-w-3xl mx-auto animate-fade';

            if(slide.type === 'theory') {
                container.innerHTML = `<div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">${slide.contentHtml}</div>`;
            } else if(slide.type === 'exercise') {
                renderExercise(container, slide);
            }
            
            contentArea.appendChild(container);
            renderMathInElement(container, {
                delimiters: [
                    {left: "\\(", right: "\\)", display: false},
                    {left: "\\[", right: "\\]", display: true}
                ]
            });
            saveState();
        }

        function renderExercise(container, slide) {
            const exData = slide.exerciseData;
            const stateId = slide.id;
            const userAnswer = appState[stateId];

            let html = `<div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                <div class="flex items-center gap-2 mb-4 text-blue-600"><i class="fas fa-pencil-alt"></i> <span class="font-bold uppercase text-sm">Exercise</span></div>
                <h3 class="text-lg font-bold mb-6">${exData.q}</h3>
                <div id="options-${stateId}" class="space-y-3 mb-6">`;

            // Shuffle options if not already shuffled or if first render
			if(!exData.shuffled && !appState[stateId]) {
				exData.options.sort(() => Math.random() - 0.5);
				exData.shuffled = true;
			}

            exData.options.forEach((opt, idx) => {
                const optId = `${stateId}-opt-${idx}`;
                const isCorrect = opt.correct;
                const isSelected = userAnswer === optId;
                
                let optClass = "option-btn w-full text-left p-4 rounded-lg border-2 border-gray-200 bg-gray-50 hover:bg-gray-100 flex items-center gap-3";
                let iconHtml = `<span class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center text-sm text-gray-400">${String.fromCharCode(65 + idx)}</span>`;
                
                if(userAnswer) {
                    if(isCorrect) {
                        optClass = "option-btn w-full text-left p-4 rounded-lg border-2 border-green-500 bg-green-50 flex items-center gap-3";
                        iconHtml = `<span class="w-6 h-6 rounded-full bg-green-500 text-white flex items-center justify-center text-sm"><i class="fas fa-check"></i></span>`;
                    } else if(isSelected && !isCorrect) {
                        optClass = "option-btn w-full text-left p-4 rounded-lg border-2 border-red-500 bg-red-50 flex items-center gap-3";
                        iconHtml = `<span class="w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center text-sm"><i class="fas fa-times"></i></span>`;
                    } else {
                        optClass = "option-btn w-full text-left p-4 rounded-lg border-2 border-gray-200 bg-gray-50 opacity-50 flex items-center gap-3";
                    }
                }

                html += `<button id="${optId}" class="${optClass}" onclick="checkAnswer('${stateId}', '${optId}', ${isCorrect})" ${userAnswer ? 'disabled' : ''}>

                        <td></td>
                        <td>${correctOpt}</td>
                        <td></td>
                    </tr>`;
                    qNum++;
                }
            });

            html += `</tbody></table>
                <div style="margin-top: 40px; text-align: right;">Checked by,<br><br><strong>Deni</strong></div>
            </div>`;
            
            printArea.innerHTML = html;
            printArea.classList.remove('hidden');
            window.print();
            printArea.classList.add('hidden');
        }

        // INITIAL RENDER
        // renderSlide(); // Will be called in the final part when all data is loaded

        // --- UI EXTENSIONS & FINAL RENDER ---
        
        // Override renderSlide to add Print button for Assignments
        const originalRenderSlide = renderSlide;
        renderSlide = function() {
            originalRenderSlide(); // Call the base render logic
            
            const sec = courseStructure[currentSectionIdx];
            // If it's an assignment section, inject a print button to the content area
            if(sec.id.startsWith('assign')) {
                const contentArea = document.getElementById('content-area');
                const printBtnContainer = document.createElement('div');
                printBtnContainer.className = 'mt-6 text-center no-print animate-fade';
                printBtnContainer.innerHTML = `
                    <button onclick="printAssignment(${currentSectionIdx})" class="px-6 py-3 bg-gray-700 hover:bg-gray-800 text-white rounded-lg shadow flex items-center gap-2 mx-auto transition">
                        <i class="fas fa-print"></i> ${t('Print Result / Cetak Hasil')}
                    </button>
                `;
                contentArea.querySelector('.max-w-3xl').appendChild(printBtnContainer);
            }
        };

        // Initial Render Call
        renderSlide();
    </script>
</body>
</html>
