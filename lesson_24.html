<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pythagorean Theorem Applications</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #58a700;
            --secondary: #1cb0f6;
            --error: #ff4b4b;
            --warning: #ffc800;
            --bg-color: #fff;
            --text-color: #3c3c3c;
            --border-color: #e5e5e5;
            --hover-bg: #f7f7f7;
            --shadow: 0 4px 0 rgba(0,0,0,0.1);
            --sidebar-width: 280px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Nunito', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #fff;
            border-right: 2px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-header {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .nav-item:hover {
            background-color: var(--hover-bg);
        }

        .nav-item.active {
            background-color: #e5f8dd;
            border-color: var(--primary);
            color: var(--primary-dark);
        }

        .nav-item.completed {
            color: var(--primary);
            border-color: var(--border-color);
        }
        
        .nav-item.completed::after {
            content: '✓';
            margin-left: auto;
            color: var(--primary);
            font-weight: bold;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
            border-radius: 50%;
            font-size: 0.8rem;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background-color: #fff;
        }

        .section-container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3 {
            color: var(--text-color);
            margin-bottom: 15px;
        }

        h1 { font-size: 2rem; }
        h2 { font-size: 1.5rem; color: var(--primary-dark); margin-top: 20px;}
        h3 { font-size: 1.2rem; margin-top: 15px; }

        .translation {
            font-size: 0.9rem;
            color: #777;
            font-style: italic;
            margin-bottom: 20px;
            display: block;
        }

        .theory-box {
            background: #f7f7f7;
            border-left: 5px solid var(--secondary);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            line-height: 1.6;
        }

        .exercise-box {
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: var(--shadow);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
            text-align: left;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #e8f7ff;
        }

        .option-btn.selected {
            border-color: var(--secondary);
            background: #e8f7ff;
            color: var(--secondary);
        }

        .option-btn.correct {
            border-color: var(--primary);
            background: #e5f8dd;
            color: var(--primary-dark);
        }

        .option-btn.incorrect {
            border-color: var(--error);
            background: #ffe5e5;
            color: var(--error);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px var(--primary-dark);
        }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px var(--primary-dark); }

        .btn-secondary {
            background: #e5e5e5;
            color: #777;
            box-shadow: 0 4px #b5b5b5;
        }
        .btn-secondary:hover { background: #d5d5d5; }
        
        .btn-danger {
            background: #fff;
            color: var(--error);
            border: 2px solid var(--error);
        }
        .btn-danger:hover { background: #ffe5e5; }

        .collapse-btn {
            background: #fff;
            border: none;
            color: var(--secondary);
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            padding: 5px;
        }
        .collapse-content {
            display: none;
            padding: 15px;
            background: #fffbeb;
            border: 2px dashed var(--warning);
            border-radius: 8px;
            margin-top: 10px;
        }
        .collapse-content.show { display: block; animation: fadeIn 0.3s; }

        .progress-bar {
            height: 10px;
            background: #e5e5e5;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .rules-box {
            background: #e8f7ff;
            border: 2px solid var(--secondary);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }

        .rules-box ul {
            margin-left: 20px;
            margin-top: 10px;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        .input-field:focus { border-color: var(--secondary); outline: none; }

        /* SVG Illustration styling */
        .svg-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        svg { max-width: 100%; height: auto; }

        /* Print Styles for Assignment */
        @media print {
            /* Sembunyikan sidebar dan konten utama sepenuhnya agar tidak buat halaman kosong */
            .sidebar, .main-content { display: none !important; }
            
            /* Tampilkan hanya area cetak */
            #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; color: black; }
            
            .no-print { display: none !important; }
            @page { size: A4; margin: 10mm; }
            
            /* Pastikan tabel pas di 1 halaman A4 */
            table { width: 100%; border-collapse: collapse; font-size: 12px; }
            th, td { border: 1px solid black; padding: 5px; text-align: left; }
            .print-header { text-align: center; margin-bottom: 20px; }
        }
        
        /* Saat di layar (bukan cetak), sembunyikan area cetak */
        #printArea { display: none; }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">Math Tutoring by Deni</div>
        <div id="nav-menu"></div>
        <button class="btn btn-danger" onclick="resetAllProgress()" style="margin-top: auto;">Reset All Progress</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div id="content-area" class="section-container"></div>
    </div>

    <!-- Print Area (Hidden on screen) -->
    <div id="printArea"></div>

    <script>
        // ==========================================
        // DATA & STATE MANAGEMENT
        // ==========================================
        const SECTIONS = [
            { id: 'home', title: 'Home', icon: '🏠' },
            { id: 'sec1', title: 'Spiral Review Warm-up (00:00-00:10)', icon: '1' },
            { id: 'sec2', title: 'Intro & Real-World (00:10-00:15)', icon: '2' },
            { id: 'sec3', title: 'Review of Prior Knowledge (00:15-00:20)', icon: '3' },
            { id: 'sec4', title: 'Problem Introduction (00:20-00:30)', icon: '4' },
            { id: 'sec5', title: 'Guided Practice (00:30-00:45)', icon: '5' },
            { id: 'sec6', title: 'Independent Practice (00:50-01:00)', icon: '6' },
            { id: 'assign1', title: 'Assignment 1', icon: 'A' },
            { id: 'assign2', title: 'Assignment 2', icon: 'A' },
            { id: 'assign3', title: 'Assignment 3', icon: 'A' },
            { id: 'assign4', title: 'Assignment 4', icon: 'A' },
            { id: 'assign5', title: 'Assignment 5', icon: 'A' },
            { id: 'final', title: 'Consolidation & Reflection (01:00-01:05)', icon: '🏁' }
        ];

        let state = {
            currentSection: 'home',
            progress: {} // Stores progress for sections and exercises
        };

        // ==========================================
        // NAVIGATION & RENDERING ENGINE
        // ==========================================
        function init() {
            buildNav();
            loadSection('home');
        }

        function buildNav() {
            const navMenu = document.getElementById('nav-menu');
            navMenu.innerHTML = '';
            SECTIONS.forEach(sec => {
                const div = document.createElement('div');
                div.className = 'nav-item' + (state.currentSection === sec.id ? ' active' : '');
                div.id = 'nav-' + sec.id;
                div.innerHTML = `<span class="nav-icon">${sec.icon}</span> ${sec.title}`;
                div.onclick = () => loadSection(sec.id);
                navMenu.appendChild(div);
            });
        }

        function loadSection(id) {
            state.currentSection = id;
            buildNav();
            const content = document.getElementById('content-area');
            content.innerHTML = '';
            
            // Scroll to top
            content.parentElement.scrollTop = 0;

            switch(id) {
                case 'home': renderHome(content); break;
                case 'sec1': renderSec1(content); break;
                case 'sec2': renderSec2(content); break;
                case 'sec3': renderSec3(content); break;
                case 'sec4': renderSec4(content); break;
                case 'sec5': renderSec5(content); break;
                case 'sec6': renderSec6(content); break;
                case 'assign1': renderAssignment(content, 1); break;
                case 'assign2': renderAssignment(content, 2); break;
                case 'assign3': renderAssignment(content, 3); break;
                case 'assign4': renderAssignment(content, 4); break;
                case 'assign5': renderAssignment(content, 5); break;
                case 'final': renderFinal(content); break;
            }
            
            // Render Math after content injection
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(content, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            } else {
                // Fallback if KaTeX loads slowly
                setTimeout(() => {
                    if (typeof renderMathInElement !== 'undefined') {
                        renderMathInElement(content, {
                            delimiters: [
                                {left: '$$', right: '$$', display: true},
                                {left: '$', right: '$', display: false}
                            ]
                        });
                    }
                }, 500);
            }
        }

        function updateNavCompletion(sectionId, isComplete) {
            const navItem = document.getElementById('nav-' + sectionId);
            if (isComplete) navItem.classList.add('completed');
            else navItem.classList.remove('completed');
        }

        function resetAllProgress() {
            if(confirm('Are you sure you want to reset all progress?')) {
                state.progress = {};
                init();
            }
        }

        // ==========================================
        // EXERCISE WIDGET LOGIC
        // ==========================================
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createExercise(data) {
            const box = document.createElement('div');
            box.className = 'exercise-box';
            box.id = data.id;
            
            let html = `<div class="question-text">${data.question}</div>`;
            
            if (data.type === 'mcq') {
                html += '<div class="options-grid">';
                let opts = data.options.map((opt, i) => ({ text: opt, correct: i === data.answer }));
                opts = shuffleArray(opts);
                opts.forEach((opt, i) => {
                    html += `<button class="option-btn" onclick="checkMCQ('${data.id}', this, ${opt.correct})">${opt.text}</button>`;
                });
                html += '</div>';
            } else if (data.type === 'input') {
                html += `<input type="text" class="input-field" id="${data.id}-input" placeholder="Type your answer here...">`;
                html += `<button class="btn btn-primary" onclick="checkInput('${data.id}', '${data.answer}')">Check</button>`;
            }

            html += `<button class="collapse-btn" id="${data.id}-collapse-btn" style="display:none;" onclick="toggleCollapse('${data.id}')">Show Explanation</button>`;
            html += `<div class="collapse-content" id="${data.id}-explanation">${data.explanation}</div>`;
            
            // Tombol Reset
            html += `<button class="btn btn-secondary" style="margin-top: 15px; font-size: 0.85rem; padding: 8px 16px;" onclick="resetExercise('${data.id}')">↻ Reset Exercise</button>`;
            
            box.innerHTML = html;
            return box;
        }

        function checkMCQ(id, btn, isCorrect) {
            const box = document.getElementById(id);
            const buttons = box.getElementsByClassName('option-btn');
            
            for (let b of buttons) {
                b.disabled = true;
                if(b === btn) {
                    b.classList.add(isCorrect ? 'correct' : 'incorrect');
                }
            }

            document.getElementById(id + '-collapse-btn').style.display = 'block';
            if(isCorrect) toggleCollapse(id); // Auto-show explanation on correct
        }

        function checkInput(id, correctAnswer) {
            const input = document.getElementById(id + '-input');
            const userAnswer = input.value.trim().toLowerCase().replace(/\s/g, '');
            const expected = correctAnswer.toLowerCase().replace(/\s/g, '');
            
            input.disabled = true;
            if (userAnswer === expected) {
                input.style.borderColor = 'var(--primary)';
                input.style.backgroundColor = '#e5f8dd';
            } else {
                input.style.borderColor = 'var(--error)';
                input.style.backgroundColor = '#ffe5e5';
            }
            
            document.getElementById(id + '-collapse-btn').style.display = 'block';
            toggleCollapse(id);
        }

        function toggleCollapse(id) {
            const content = document.getElementById(id + '-explanation');
            content.classList.toggle('show');
        }
		
        function resetExercise(id) {
            const box = document.getElementById(id);
            if (!box) return;

            // Reset MCQ buttons
            const buttons = box.getElementsByClassName('option-btn');
            for (let b of buttons) {
                b.disabled = false;
                b.classList.remove('correct', 'incorrect', 'selected');
            }

            // Reset Input fields
            const inputs = box.getElementsByClassName('input-field');
            for (let inp of inputs) {
                inp.disabled = false;
                inp.value = '';
                inp.style.borderColor = 'var(--border-color)';
                inp.style.backgroundColor = '#fff';
            }

            // Hapus keterangan jawaban benar yang ditambahkan saat salah menjawab input assignment
            const notes = box.getElementsByTagName('span');
            for (let i = notes.length - 1; i >= 0; i--) {
                if (notes[i].innerText.includes('Correct:')) {
                    notes[i].remove();
                }
            }

            // Aktifkan kembali tombol Check (jika ada)
            const btns = box.getElementsByTagName('button');
            for (let b of btns) {
                if (b.innerText.toLowerCase().includes('check')) {
                    b.disabled = false;
                }
            }

            // Sembunyikan penjelasan dan tombol show explanation
            const collapseBtn = document.getElementById(id + '-collapse-btn');
            if (collapseBtn) collapseBtn.style.display = 'none';
            
            const exp = document.getElementById(id + '-explanation') || document.getElementById(id + '-exp');
            if (exp) exp.classList.remove('show');
        }

        function createControls(prevId, nextId) {
            const div = document.createElement('div');
            div.className = 'controls';
            
            if (prevId) div.innerHTML += `<button class="btn btn-secondary" onclick="loadSection('${prevId}')">← Previous</button>`;
            else div.innerHTML += `<div></div>`; // Spacer
            
            if (nextId) div.innerHTML += `<button class="btn btn-primary" onclick="loadSection('${nextId}')">Next →</button>`;
            return div;
        }

        function createTheory(title, enText, idText, svg = '') {
            return `<div class="theory-box">
                <h3>${title}</h3>
                <p>${enText}</p>
                <p class="translation">${idText}</p>
                ${svg}
            </div>`;
        }

        // ==========================================
        // SECTION RENDERERS
        // ==========================================
        function renderHome(container) {
            container.innerHTML = `
                <h1>MATH TUTORING by Deni</h1>
                <span class="translation">Bimbingan Belajar Matematika oleh Deni</span>
                
                <h2>Topic: Pythagorean Theorem (Applications)</h2>
                <span class="translation">Topik: Teorema Pythagoras (Aplikasi)</span>
                
                <div class="rules-box">
                    <h3>Class Rules / Aturan Kelas:</h3>
                    <ul>
                        <li>Take turns speaking. <br><span class="translation">Berbicara secara bergantian.</span></li>
                        <li>Ask for permission if you need to leave the class. <br><span class="translation">Meminta izin jika ingin meninggalkan kelas.</span></li>
                        <li>Turn on your camera and microphone when needed. <br><span class="translation">Menyalakan kamera dan microphone jika diperlukan.</span></li>
                    </ul>
                </div>
                
                <div class="svg-container">
                    <!-- Pythagorean Triangle SVG -->
                    <svg width="200" height="150" viewBox="0 0 200 150">
                        <polygon points="30,120 150,120 30,30" fill="#e5f8dd" stroke="#58cc02" stroke-width="3"/>
                        <text x="70" y="140" font-family="sans-serif" font-size="14" fill="#3c3c3c">b</text>
                        <text x="15" y="80" font-family="sans-serif" font-size="14" fill="#3c3c3c">a</text>
                        <text x="100" y="70" font-family="sans-serif" font-size="14" fill="#3c3c3c">c</text>
                        <rect x="25" y="110" width="10" height="10" fill="none" stroke="#3c3c3c" stroke-width="1"/>
                    </svg>
                </div>
            `;
            container.appendChild(createControls(null, 'sec1'));
        }

        // We will add the rest of the renderers in the next steps
        // ==========================================
        // SECTION RENDERERS (PART 2)
        // ==========================================
        function renderSec1(container) {
            let html = `
                <h1>Section 1: Spiral Review Warm-up</h1>
                <span class="translation">Bagian 1: Pemanasan Tinjauan Spiral</span>
                <div class="progress-bar"><div class="progress-fill" style="width: 0%"></div></div>
            `;
            container.innerHTML = html;

            // Theory 1
            container.innerHTML += createTheory(
                'Variables and Constants / Variabel dan Konstanta',
                'A <b>variable</b> is a symbol (like $x$ or $y$) that represents an unknown number. A <b>constant</b> is a fixed number that does not change.',
                '<b>Variabel</b> adalah simbol (seperti $x$ atau $y$) yang mewakili bilangan yang tidak diketahui. <b>Konstanta</b> adalah bilangan tetap yang tidak berubah.'
            );

            // Exercises 1-3
            container.appendChild(createExercise({
                id: 'ex1-1', type: 'mcq',
                question: 'Which of the following is the variable in the expression $5x + 3$?',
                options: ['5', 'x', '3', '+'],
                answer: 1,
                explanation: 'The variable is $x$ because it represents an unknown value. 5 and 3 are constants. / Variabelnya adalah $x$ karena mewakili nilai yang tidak diketahui. 5 dan 3 adalah konstanta.'
            }));
            container.appendChild(createExercise({
                id: 'ex1-2', type: 'mcq',
                question: 'What is the value of the constant in the expression $7y - 12$?',
                options: ['7', 'y', '-12', '12'],
                answer: 2,
                explanation: 'The constant is -12 because it is the fixed number. 7 is the coefficient. / Konstantanya adalah -12 karena itu adalah bilangan tetap. 7 adalah koefisien.'
            }));
            container.appendChild(createExercise({
                id: 'ex1-3', type: 'mcq',
                question: 'Identify the variables in the expression: $3a + 2b - 5$',
                options: ['3 and 2', 'a and b', '5', '3, a, 2, b'],
                answer: 1,
                explanation: 'The variables are $a$ and $b$ (the letters). 3 and 2 are coefficients, 5 is a constant. / Variabelnya adalah $a$ dan $b$ (huruf-hurufnya). 3 dan 2 adalah koefisien, 5 adalah konstanta.'
            }));

            // Theory 2
            container.innerHTML += createTheory(
                'Translating Verbal Expressions / Menerjemahkan Ekspresi Verbal',
                'We can translate word problems into algebraic expressions. For example, "The price of 5 books ($b$) minus a discount of 2000" becomes $5b - 2000$.',
                'Kita dapat menerjemahkan soal cerita ke dalam ekspresi aljabar. Misalnya, "Harga 5 buku ($b$) dikurangi diskon 2000" menjadi $5b - 2000$.'
            );

            // Exercises 4-6
            container.appendChild(createExercise({
                id: 'ex1-4', type: 'mcq',
                question: 'If the price of one book is $b$, how do you write "the price of 5 books minus a discount of 2000"?',
                options: ['$b - 2000$', '$5b - 2000$', '$5(b - 2000)$', '$5b + 2000$'],
                answer: 1,
                explanation: '5 books means $5 \\times b = 5b$. Minus 2000 means subtract 2000: $5b - 2000$. / 5 buku berarti $5b$. Dikurangi 2000 berarti $5b - 2000$.'
            }));
            container.appendChild(createExercise({
                id: 'ex1-5', type: 'mcq',
                question: 'Write an expression for "three times your age ($n$) plus 5 years".',

                { type: 'mcq', q: 'Box 6x8x10. Find the space diagonal.', opts: ['$10\\sqrt{2}$', '10', '20', '14'], ans: 0, correctText: '$10\\sqrt{2}$', exp: 'Base $= 10$. Space diag $= \\sqrt{10^2+10^2} = 10\\sqrt{2}$.' }
            ],
            4: [ // Space Diagonals - Cubes
                { type: 'input', q: 'Cube volume is 125cm³. Find the side length.', ans: '5', correctText: '5', exp: '$s^3 = 125 \\Rightarrow s = 5$cm.' },
                { type: 'mcq', q: 'Cube side is 5. Find the space diagonal.', opts: ['$5\\sqrt{3}$', '$5\\sqrt{2}$', '15', '10'], ans: 0, correctText: '$5\\sqrt{3}$', exp: 'Space diag $= s\\sqrt{3} = 5\\sqrt{3}$.' },
                { type: 'mcq', q: 'Cube side is 4. Find the space diagonal.', opts: ['$4\\sqrt{3}$', '16', '8', '$4\\sqrt{2}$'], ans: 0, correctText: '$4\\sqrt{3}$', exp: 'Space diag $= 4\\sqrt{3}$.' },
                { type: 'mcq', q: 'Cube side is 3. Find the face diagonal.', opts: ['$3\\sqrt{2}$', '$3\\sqrt{3}$', '6', '9'], ans: 0, correctText: '$3\\sqrt{2}$', exp: 'Face diag $= s\\sqrt{2} = 3\\sqrt{2}$.' },
                { type: 'input', q: 'Cube volume is 64cm³. Find the side length.', ans: '8', correctText: '8', exp: '$s^3 = 64 \\Rightarrow s = 8$cm.' },
                { type: 'mcq', q: 'Cube volume is 64. Find the space diagonal.', opts: ['$8\\sqrt{3}$', '12', '16', '$8\\sqrt{2}$'], ans: 0, correctText: '$8\\sqrt{3}$', exp: '$s=8$. Diag $= 8\\sqrt{3}$.' },
                { type: 'mcq', q: 'Cube volume is 27. Find the face diagonal.', opts: ['$3\\sqrt{2}$', '$3\\sqrt{3}$', '6', '9'], ans: 0, correctText: '$3\\sqrt{2}$', exp: '$s=3$. Face diag $= 3\\sqrt{2}$.' },
                { type: 'input', q: 'If space diagonal is $\\sqrt{12}$, what is the side length?', ans: '2', correctText: '2', exp: '$s\\sqrt{3} = \\sqrt{12} = 2\\sqrt{3} \\Rightarrow s=2$.' },
                { type: 'mcq', q: 'Cube side is 10. Find the space diagonal.', opts: ['$10\\sqrt{3}$', '100', '20', '$10\\sqrt{2}$'], ans: 0, correctText: '$10\\sqrt{3}$', exp: '$10\\sqrt{3}$.' },
                { type: 'mcq', q: 'Cube side is 6. Find the face diagonal.', opts: ['$6\\sqrt{2}$', '$6\\sqrt{3}$', '12', '36'], ans: 0, correctText: '$6\\sqrt{2}$', exp: '$6\\sqrt{2}$.' }
            ],
            5: [ // Mixed Real-World Applications
                { type: 'input', q: 'Pole 12m high, wire attached 5m from base. Find length of 1 wire.', ans: '13', correctText: '13', exp: '$\\sqrt{12^2 + 5^2} = 13$m.' },
                { type: 'input', q: 'If 4 wires are needed, what is the total length?', ans: '52', correctText: '52', exp: '$4 \\times 13 = 52$m.' },
                { type: 'input', q: 'Gecko in room 4x3x12. Find the base diagonal.', ans: '5', correctText: '5', exp: '$\\sqrt{4^2+3^2} = 5$m.' },
                { type: 'input', q: 'Gecko crawls from corner to opposite corner. Find space diagonal.', ans: '13', correctText: '13', exp: '$\\sqrt{5^2 + 12^2} = 13$m.' },
                { type: 'mcq', q: 'Ladder 5m, base 3m. Find height.', opts: ['4m', '2m', '8m', '16m'], ans: 0, correctText: '4m', exp: '$\\sqrt{5^2-3^2} = 4$m.' },
                { type: 'mcq', q: 'Ship 20S, 21W. Find distance.', opts: ['29km', '41km', '400km', '58km'], ans: 0, correctText: '29km', exp: '$\\sqrt{20^2+21^2} = 29$km.' },
                { type: 'mcq', q: 'Rectangle 15x8. Find diagonal.', opts: ['17cm', '23cm', '12cm', '289cm'], ans: 0, correctText: '17cm', exp: '$\\sqrt{15^2+8^2} = 17$cm.' },
                { type: 'mcq', q: 'Box 12x9x8. Find space diagonal.', opts: ['17cm', '15cm', '29cm', '13cm'], ans: 0, correctText: '17cm', exp: '$\\sqrt{12^2+9^2+8^2} = 17$cm.' },
                { type: 'mcq', q: 'Park isosceles, base 16, slant 17. Find height.', opts: ['15m', '8m', '12m', '16m'], ans: 0, correctText: '15m', exp: '$h^2+8^2=17^2 \\Rightarrow h=15$m.' },
                { type: 'mcq', q: 'Park area 120m², cost 50k/m². Find total cost.', opts: ['Rp 6,000,000', 'Rp 600,000', 'Rp 12,000,000', 'Rp 120,000'], ans: 0, correctText: 'Rp 6,000,000', exp: '$120 \\times 50000 = 6,000,000$.' }
            ]
        };

        let assignmentScores = { 1: {score:0, answered:0}, 2: {score:0, answered:0}, 3: {score:0, answered:0}, 4: {score:0, answered:0}, 5: {score:0, answered:0} };

        function renderAssignment(container, num) {
            assignmentScores[num] = {score:0, answered:0}; // Reset score on render
            let html = `
                <h1>Assignment ${num}</h1>
                <span class="translation">Tugas ${num}</span>
                <div class="progress-bar"><div class="progress-fill" style="width: 0%"></div></div>
                <p>Complete all 10 questions. After finishing, a button to print your result will appear.</p>
                <span class="translation">Selesaikan 10 soal. Setelah selesai, tombol untuk mencetak hasil akan muncul.</span>
            `;
            container.innerHTML = html;

            const data = assignmentData[num];
            data.forEach((item, index) => {
                const exId = `assign-${num}-ex-${index}`;
                let exerciseHtml = `<div class="exercise-box" id="${exId}"><div class="question-text">${index + 1}. ${item.q}</div>`;
                
                if (item.type === 'mcq') {
                    exerciseHtml += '<div class="options-grid">';
                    let opts = item.opts.map(opt => ({ text: opt, correct: opt === item.correctText }));
                    opts = shuffleArray(opts);
                    opts.forEach(opt => {
                        exerciseHtml += `<button class="option-btn" onclick="checkAssignMCQ('${exId}', this, ${opt.correct}, '${item.correctText.replace(/'/g, "\\'")}', ${num})">${opt.text}</button>`;
                    });
                    exerciseHtml += '</div>';
                } else {
                    exerciseHtml += `<input type="text" class="input-field" id="${exId}-input" placeholder="Your answer...">`;
                    exerciseHtml += `<button class="btn btn-primary" onclick="checkAssignInput('${exId}', '${item.ans.replace(/'/g, "\\'")}', '${item.correctText.replace(/'/g, "\\'")}', ${num})">Check</button>`;
                }

                exerciseHtml += `<div class="collapse-content" id="${exId}-exp">${item.exp}</div>`;
                
                // Tombol Reset untuk Assignment
                exerciseHtml += `<button class="btn btn-secondary" style="margin-top: 15px; font-size: 0.85rem; padding: 8px 16px;" onclick="resetExercise('${exId}')">↻ Reset Exercise</button>`;
                
                exerciseHtml += `</div>`;
                container.innerHTML += exerciseHtml;
            });

            // Print Button Container
            container.innerHTML += `<div id="print-btn-container-${num}" style="display:block; text-align:center; margin:30px 0;">
                <button class="btn btn-primary" onclick="generatePrintContent(${num})">Print Result (A4)</button>
            </div>`;

            container.appendChild(createControls(num > 1 ? `assign${num-1}` : 'sec6', num < 5 ? `assign${num+1}` : 'final'));
        }

        function checkAssignMCQ(id, btn, isCorrect, correctText, assignNum) {
            const box = document.getElementById(id);
            const buttons = box.getElementsByClassName('option-btn');
            for (let b of buttons) {
                b.disabled = true;
                if(b === btn) b.classList.add(isCorrect ? 'correct' : 'incorrect');
                if(b.innerText === correctText) b.classList.add('correct'); // Always highlight correct one
            }
            document.getElementById(id + '-exp').classList.add('show');
            
            // Simpan jawaban siswa
            box.dataset.studentAnswer = btn.innerText;
            
            assignmentScores[assignNum].answered++;
            if(isCorrect) assignmentScores[assignNum].score++;
            checkAssignComplete(assignNum);
        }

        function checkAssignInput(id, correctAns, correctText, assignNum) {
            const input = document.getElementById(id + '-input');
            const box = document.getElementById(id);
            const userAns = input.value.trim().toLowerCase().replace(/\s/g, '');
            const expected = correctAns.toLowerCase().replace(/\s/g, '');
            
            input.disabled = true;
            if (userAns === expected) {
                input.style.borderColor = 'var(--primary)';
                input.style.backgroundColor = '#e5f8dd';
                assignmentScores[assignNum].score++;
            } else {
                input.style.borderColor = 'var(--error)';
                input.style.backgroundColor = '#ffe5e5';
                // Append correct answer visually
                const note = document.createElement('span');
                note.style.color = 'var(--error)';
                note.style.marginLeft = '10px';
                note.innerText = `(Correct: ${correctText})`;
                input.parentNode.insertBefore(note, input.nextSibling);
            }
            document.getElementById(id + '-exp').classList.add('show');
            
            // Simpan jawaban siswa
            box.dataset.studentAnswer = input.value;
            
            assignmentScores[assignNum].answered++;
            checkAssignComplete(assignNum);
        }

        function checkAssignComplete(assignNum) {
            if (assignmentScores[assignNum].answered === 10) {
                document.getElementById(`print-btn-container-${assignNum}`).style.display = 'block';
                document.getElementById(`print-btn-container-${assignNum}`).scrollIntoView({behavior: 'smooth'});
            }
        }

        function generatePrintContent(assignNum) {
            const printArea = document.getElementById('printArea');
            const score = assignmentScores[assignNum].score;
            const dateStr = new Date().toLocaleDateString();
            const data = assignmentData[assignNum];

            let tableRows = '';
            data.forEach((item, index) => {
                const exId = `assign-${assignNum}-ex-${index}`;
                const exBox = document.getElementById(exId);
                const studentAns = exBox ? (exBox.dataset.studentAnswer || '_______') : '_______';
                
                let checkMark = '';
                if(studentAns !== '_______') {
                    checkMark = studentAns.toLowerCase().replace(/\s/g, '') === item.correctText.toLowerCase().replace(/\s/g, '') ? '✓' : '✗';
                }

                tableRows += `
                    <tr>
                        <td style="text-align:center">${index + 1}</td>
                        <td>${item.q}</td>
                        <td style="text-align:center">${studentAns}</td>
                        <td style="text-align:center">${item.correctText}</td>
                        <td style="text-align:center">${checkMark}</td>
                    </tr>
                `;
            });

            printArea.innerHTML = `
                <div class="print-header">
                    <h2>MATH TUTORING by Deni</h2>
                    <p><b>Name:</b> ____________________ &nbsp;&nbsp; <b>Date:</b> ${dateStr}</p>
                    <p><b>Topic:</b> Pythagorean Theorem (Applications) &nbsp;&nbsp; <b>Assignment Group:</b> ${assignNum}</p>
                    <p><b>Score:</b> ${score} / 10</p>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th style="width:5%">No.</th>
                            <th style="width:45%">Question</th>
                            <th style="width:20%">Student Answer</th>
                            <th style="width:20%">Correct Answer</th>
                            <th style="width:10%">Note</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
                <br>
                <p style="text-align:right; margin-top:20px;">Checked by,<br><br><b>Deni</b></p>
            `;

            // Render KaTeX di dalam area cetak agar simbol $ berubah menjadi rumus matematika
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(printArea, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }

            // Beri delay sebentar agar KaTeX selesai merender sebelum dialog print muncul
            setTimeout(() => {
                window.print();
            }, 500);
        }

        function renderFinal(container) {
            let html = `
                <h1>Consolidation & Reflection</h1>
                <span class="translation">Konsolidasi & Refleksi</span>
                <div class="progress-bar"><div class="progress-fill" style="width: 100%"></div></div>
                
                <div class="theory-box">
                    <h3>What We Learned Today / Apa yang Kita Pelajari Hari Ini</h3>
                    <ul>
                        <li>How to find the shortest distance between two points using $\\Delta x$ and $\\Delta y$. <br><span class="translation">Cara mencari jarak terpendek antara dua titik.</span></li>
                        <li>How to calculate the space diagonal of 3D shapes (cuboids and cubes) in two steps. <br><span class="translation">Cara menghitung diagonal ruang bangun 3D dalam dua langkah.</span></li>
                        <li>How to find the height and area of an isosceles triangle by splitting the base. <br><span class="translation">Cara mencari tinggi dan luas segitiga sama kaki.</span></li>
                    </ul>
                </div>

                <div class="exercise-box">
                    <h3>Self-Reflection / Refleksi Diri</h3>
                    <p>What part of today's lesson was the most challenging for you?</p>
                    <span class="translation">Bagian apa dari pelajaran hari ini yang paling menantang bagimu?</span>
                    <textarea class="input-field" rows="3" placeholder="Type your thoughts here..."></textarea>
                    
                    <p>Practice makes perfect! Always remember the two-step process for 3D diagonals.</p>
                    <span class="translation">Latihan membuatmu semakin hebat! Selalu ingat proses dua langkah untuk diagonal ruang 3D.</span>
                </div>

                <div style="text-align: center; margin: 30px 0;">
                    <h3>Ready for your next challenge?</h3>
                    <span class="translation">Siap untuk tantangan berikutnya?</span>
                    <br><br>
                    <a href="https://learn.algonova.id/login" target="_blank" class="btn btn-primary" style="text-decoration:none; display:inline-flex;">
                        Go to Algonova Login
                    </a>
                </div>
            `;
            container.innerHTML = html;
            container.appendChild(createControls('assign5', null));
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        // Start the app (This was at the end of Part 1, ensure it runs after all functions are defined)
        // init(); 

        // Start the app
        init();
    </script>
