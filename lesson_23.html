<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pythagorean Theorem - Interactive Lesson</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- KaTeX Auto-render -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #58a700;
            --secondary: #1cb0f6;
            --danger: #ff4b4b;
            --warning: #ffc800;
            --bg-color: #fff;
            --text-color: #3c3c3c;
            --border-color: #e5e5e5;
            --card-bg: #ffffff;
            --sidebar-bg: #ffffff;
            --hover-bg: #f7f7f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 2px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            color: #afafaf;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .nav-item:hover {
            background-color: var(--hover-bg);
            color: var(--text-color);
        }

        .nav-item.active {
            background-color: #e5f7ff;
            color: var(--secondary);
            border-color: var(--secondary);
        }

        .nav-item.completed {
            color: var(--primary);
        }

        .nav-item .icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        .content-container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Theory & Typography */
        h1, h2, h3 {
            color: var(--text-color);
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .translation {
            display: block;
            font-size: 0.9rem;
            color: #777;
            font-style: italic;
            margin-bottom: 15px;
        }

        .theory-box {
            background-color: #fff9e5;
            border-left: 5px solid var(--warning);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        /* Exercises */
        .exercise-card {
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .exercise-card.answered {
            border-color: var(--secondary);
        }

        .question-text {
            font-weight: 700;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 15px;
            border: 2px solid var(--border-color);
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            color: var(--text-color);
            transition: all 0.2s;
            text-align: left;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #b0b0b0;
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background-color: #e5f7ff;
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .option-btn.selected:hover {
            transform: translateY(0);
        }

        .option-btn.correct {
            background-color: #d7ffb8;
            border-color: var(--primary);
            color: var(--primary-dark);
        }

        .option-btn.incorrect {
            background-color: #ffdfe0;
            border-color: var(--danger);
            color: var(--danger);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        /* Controls */
        .exercise-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn:disabled {
            background-color: #e5e5e5;
            color: #afafaf;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Collapsible Explanation */
        .explanation {
            margin-top: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            display: none;
        }

        .explanation.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 500px; }
        }

        /* Print Styles */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 0;
            }
            @page {
                size: A4;
                margin: 10mm;
            }
        }

        #printArea { display: none; }

        #printArea { display: none; }

        /* Input text for answers */
        .text-input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        /* Badges */
        .section-badge {
            display: inline-block;
            background: var(--secondary);
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }
        
        .svg-illustration {
            display: block;
            margin: 20px auto;
            max-width: 200px;
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">MATH TUTORING by Deni</div>
        <div id="navMenu"></div>
        <button class="btn btn-danger" style="margin-top: 20px; width: 100%;" onclick="resetAllProgress()">Reset All Progress</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="content-container" id="contentContainer">
            <!-- Dynamic content goes here -->
        </div>
    </div>

    <!-- Hidden Print Area -->
    <div id="printArea"></div>

    <script>
        // ==========================================
        // GLOBAL STATE & DATA STRUCTURE
        // ==========================================
        const AppData = {
            sections: [
                { id: 'home', title: 'Home', icon: '🏠' },
                { id: 'sec1', title: 'Spiral Review Warm-up', time: '00:00-00:10', icon: '🔥' },
                { id: 'sec2', title: 'Intro & Real-World', time: '00:10-00:15', icon: '🌍' },
                { id: 'sec3', title: 'Prior Knowledge', time: '00:15-00:20', icon: '📚' },
                { id: 'sec4', title: 'Problem Introduction', time: '00:20-00:30', icon: '💡' },
                { id: 'sec5', title: 'Guided Practice', time: '00:30-00:45', icon: '🧭' },
                { id: 'sec6', title: 'Independent Practice', time: '00:50-01:00', icon: '✍️' },
                { id: 'assign1', title: 'Assignment 1', icon: '📝' },
                { id: 'assign2', title: 'Assignment 2', icon: '📝' },
                { id: 'assign3', title: 'Assignment 3', icon: '📝' },
                { id: 'assign4', title: 'Assignment 4', icon: '📝' },
                { id: 'assign5', title: 'Assignment 5', icon: '📝' },
                { id: 'consolidation', title: 'Consolidation', time: '01:00-01:05', icon: '🎓' }
            ],
            progress: {} 
        };

        // Initialize progress tracking
        AppData.sections.forEach(s => {
            AppData.progress[s.id] = { completed: false, answers: {} };
        });

        let currentSection = 'home';

        // ==========================================
        // RENDER ENGINE
        // ==========================================
        function renderNav() {
            const nav = document.getElementById('navMenu');
            nav.innerHTML = '';
            AppData.sections.forEach(sec => {
                const div = document.createElement('div');
                div.className = `nav-item ${currentSection === sec.id ? 'active' : ''} ${AppData.progress[sec.id].completed ? 'completed' : ''}`;
                div.innerHTML = `<span class="icon">${sec.icon}</span> ${sec.title}`;
                if (sec.time) div.innerHTML += `<br><small style="font-size:0.7rem; margin-left:30px;">${sec.time}</small>`;
                div.onclick = () => loadSection(sec.id);
                nav.appendChild(div);
            });
        }

        function loadSection(id) {
            currentSection = id;
            renderNav();
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';
            
            switch(id) {
                case 'home': renderHome(container); break;
                case 'sec1': renderSection1(container); break;
                case 'sec2': renderSection2(container); break;
                case 'sec3': renderSection3(container); break;
                case 'sec4': renderSection4(container); break;
                case 'sec5': renderSection5(container); break; // TAMBAHAN PART 3
                case 'sec6': renderSection6(container); break; // TAMBAHAN PART 3
                case 'assign1': renderAssignment(container, 'assign1', 1); break; // TAMBAHAN PART 3
                case 'assign2': renderAssignment(container, 'assign2', 2); break; // TAMBAHAN PART 3
                case 'assign3': renderAssignment(container, 'assign3', 3); break; // TAMBAHAN PART 3
                case 'assign4': renderAssignment(container, 'assign4', 4); break; // TAMBAHAN PART 3
                case 'assign5': renderAssignment(container, 'assign5', 5); break; // TAMBAHAN PART 3
                case 'consolidation': renderConsolidation(container); break; // TAMBAHAN PART 3
                default: container.innerHTML = `<h2>Coming Soon...</h2><p>This section is under development.</p>`;
            }

            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(container, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }
        }

        // ==========================================
        // REUSABLE COMPONENTS
        // ==========================================
        function createExerciseCard(sectionId, exData, index, totalExercises, nextSectionId) {
            const card = document.createElement('div');
            card.className = 'exercise-card';
            card.id = `${sectionId}-ex-${exData.id}`;
            
            let optionsHTML = '';
            if (exData.type === 'mcq') {
                const shuffled = [...exData.options].sort(() => 0.5 - Math.random());
                optionsHTML = '<div class="options-grid">';
                shuffled.forEach(opt => {
                    optionsHTML += `<button class="option-btn" data-opt-id="${opt.id}" onclick="handleMCQ('${sectionId}', '${exData.id}', '${opt.id}', this)">${opt.text}</button>`;
                });
                optionsHTML += '</div>';
            } else if (exData.type === 'input') {
                optionsHTML = `<input type="text" class="text-input" id="${sectionId}-input-${exData.id}" placeholder="Type your answer here...">`;
            }

            const isLast = index === totalExercises - 1;
            const isFirst = index === 0;

            card.innerHTML = `
                <div class="section-badge">Exercise ${exData.id} of ${totalExercises}</div>
                <div class="question-text">${exData.q}</div>
                <div class="translation">${exData.q_id}</div>
                ${optionsHTML}
                <div class="exercise-controls">
                    <button class="btn btn-secondary" onclick="resetExercise('${sectionId}', '${exData.id}')">Reset</button>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-secondary" onclick="navigateExercise(${index - 1}, '${sectionId}')" ${isFirst ? 'disabled' : ''}>Previous</button>
                        <button class="btn btn-primary" onclick="checkAnswer('${sectionId}', '${exData.id}')">Check</button>
                        <button class="btn btn-primary" onclick="navigateExercise(${index + 1}, '${sectionId}', '${isLast ? nextSectionId : ''}')" ${isLast && !nextSectionId ? 'disabled' : ''}>${isLast && nextSectionId ? 'Next Section' : 'Next'}</button>
                    </div>
                </div>
                <div class="explanation" id="exp-${sectionId}-${exData.id}">
                    <strong>Explanation:</strong> <span id="exp-text-${sectionId}-${exData.id}"></span><br>
                    <small class="translation">Penjelasan: <span id="exp-text-id-${sectionId}-${exData.id}"></span></small>
                </div>
            `;
            return card;
        }

        function navigateExercise(nextIndex, secId, nextSectionId = '') {
            if (nextIndex < 0) return;
            
            const exercises = SectionData[secId].exercises;
            if (nextIndex < exercises.length) {
                document.getElementById(`${secId}-ex-${exercises[nextIndex].id}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (nextSectionId) {
                loadSection(nextSectionId);
            }
        }

        function handleMCQ(secId, exId, optId, btn) {
            const card = document.getElementById(`${secId}-ex-${exId}`);
            const buttons = card.querySelectorAll('.option-btn');
            
            // Reset semua tombol ke kondisi normal (belum dicek)
            buttons.forEach(b => {
                b.classList.remove('correct', 'incorrect', 'selected');
                b.disabled = false;
            });
            
            // Tandai tombol yang diklik sebagai 'selected'
            btn.classList.add('selected');
            AppData.progress[secId].answers[exId] = optId;
        }

        function checkAnswer(secId, exId) {
            const ex = getExerciseData(secId, exId);
            if (!ex) return;
            
            let userAnswer = '';
            let isCorrect = false;
            const card = document.getElementById(`${secId}-ex-${exId}`);
            
            if (ex.type === 'mcq') {
                userAnswer = AppData.progress[secId].answers[exId];
                if (!userAnswer) { alert('Please select an option!'); return; }
                isCorrect = userAnswer === ex.correct;
                
                card.querySelectorAll('.option-btn').forEach(btn => {
                    btn.disabled = true; 
                    btn.classList.remove('selected'); 
                    const optId = btn.getAttribute('data-opt-id');
                    if (optId === ex.correct) btn.classList.add('correct');
                    if (optId === userAnswer && !isCorrect) btn.classList.add('incorrect');
                });
            } else if (ex.type === 'input') {
                const input = document.getElementById(`${secId}-input-${exId}`);
                userAnswer = input.value.trim().toLowerCase();
                if (!userAnswer) { alert('Please type your answer!'); return; }
                
                // PERBAIKAN: Simpan jawaban asli siswa ke AppData
                AppData.progress[secId].answers[exId] = input.value;
                
                isCorrect = userAnswer === ex.correct.toLowerCase();
                input.disabled = true;
                input.style.borderColor = isCorrect ? 'var(--primary)' : 'var(--danger)';
                input.style.color = isCorrect ? 'var(--primary-dark)' : 'var(--danger)';
            }

            AppData.progress[secId].answers[exId + '_correct'] = isCorrect;
            card.classList.add('answered');
            
            const expDiv = document.getElementById(`exp-${secId}-${exId}`);
            document.getElementById(`exp-text-${secId}-${exId}`).innerHTML = isCorrect ? ex.exp_en : ex.exp_en + " (Incorrect)";
            document.getElementById(`exp-text-id-${secId}-${exId}`).innerHTML = isCorrect ? ex.exp_id : ex.exp_id + " (Salah)";
            expDiv.classList.add('show');
            
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(expDiv, {delimiters: [{left: '$', right: '$', display: false}]});
            }
        }

        function resetExercise(secId, exId) {
            const ex = getExerciseData(secId, exId);
            const card = document.getElementById(`${secId}-ex-${exId}`);
            card.classList.remove('answered');
            
            if (ex.type === 'mcq') {
                card.querySelectorAll('.option-btn').forEach(btn => {
                    btn.classList.remove('correct', 'incorrect', 'selected');
                    btn.disabled = false;
                    btn.style.opacity = '1';
                });
            } else if (ex.type === 'input') {
                const input = document.getElementById(`${secId}-input-${exId}`);
                input.value = '';
                input.disabled = false;
                input.style.borderColor = '';
                input.style.color = '';
            }
            
            document.getElementById(`exp-${secId}-${exId}`).classList.remove('show');
            delete AppData.progress[secId].answers[exId];
            delete AppData.progress[secId].answers[exId + '_correct'];
        }

        function resetAllProgress() {
            if(confirm('Are you sure you want to reset ALL progress? This cannot be undone.')) {
                AppData.sections.forEach(s => {
                    AppData.progress[s.id] = { completed: false, answers: {} };
                });
                loadSection(currentSection);
                renderNav();
            }
        }

        // Temporary mock function until Part 2 data structure is injected
        function getExerciseData(secId, exId) {
            // This will be properly implemented with full data in subsequent parts
            const data = SectionData[secId]?.exercises?.find(e => e.id == exId);
            return data;
        }

        // ==========================================
        // CONTENT: HOME
        // ==========================================
        function renderHome(container) {
            container.innerHTML = `
                <h1>MATH TUTORING by Deni</h1>
                <p><strong>Topic: Pythagorean Theorem (Basics)</strong></p>
                <p class="translation"><strong>Topik: Teorema Pythagoras (Konsep Dasar)</strong></p>
                
                <div class="theory-box">
                    <h3>Class Rules <span class="translation">Aturan Kelas</span></h3>
                    <ol>
                        <li>Take turns speaking. <span class="translation">Berbicara secara bergantian.</span></li>
                        <li>Ask for permission if you need to leave the class. <span class="translation">Meminta izin jika ingin meninggalkan kelas.</span></li>
                        <li>Turn on your camera and microphone if needed. <span class="translation">Menyalakan kamera dan microphone jika diperlukan.</span></li>
                    </ol>
                </div>
                <button class="btn btn-primary" onclick="loadSection('sec1')">Start Lesson <span class="translation">Mulai Pelajaran</span></button>
            `;
        }

        // ==========================================
        // CONTENT: SECTION 1 (Spiral Review)
        // ==========================================
        const SectionData = {
            sec1: {
                exercises: [
                    { id: 1, type: 'mcq', q: "Write the algebraic expression for: '7 more than 3 times x'", q_id: "Tuliskan ekspresi aljabar untuk: '7 lebihnya dari 3 kali x'", options: [ {id:'a', text:'3x - 7'}, {id:'b', text:'3x + 7'}, {id:'c', text:'7x + 3'}, {id:'d', text:'3(x + 7)'} ], correct: 'b', exp_en: "3 times x is 3x. '7 more' means we add 7. So, 3x + 7.", exp_id: "3 kali x adalah 3x. '7 lebihnya' berarti kita tambah 7. Jadi, 3x + 7." },
                    { id: 2, type: 'mcq', q: "In the expression $5p + 10$, which is the variable and which is the constant?", q_id: "Pada ekspresi $5p + 10$, mana yang merupakan variabel dan mana yang konstanta?", options: [ {id:'a', text:'Var: 5, Const: p'}, {id:'b', text:'Var: p, Const: 10'}, {id:'c', text:'Var: 10, Const: 5p'}, {id:'d', text:'Var: 5p, Const: 10'} ], correct: 'b', exp_en: "The variable is the letter (p), and the constant is the number without a variable (10).", exp_id: "Variabel adalah hurufnya (p), dan konstanta adalah angka tanpa variabel (10)." },
                    { id: 3, type: 'input', q: "Write the expression for: 'Half of y decreased by 4'", q_id: "Tulis ekspresi untuk: 'Setengah dari y dikurangi 4'", correct: '0.5y - 4', exp_en: "Half of y is (1/2)y or 0.5y. Decreased by 4 means -4. Answer: 0.5y - 4 or y/2 - 4.", exp_id: "Setengah dari y adalah (1/2)y atau 0.5y. Dikurangi 4 berarti -4. Jawaban: 0.5y - 4." },
                    { id: 4, type: 'mcq', q: "What are the coefficients in $2a + 3b - 5$?", q_id: "Sebutkan semua koefisien pada $2a + 3b - 5$", options: [ {id:'a', text:'2 and 3'}, {id:'b', text:'2, 3, and -5'}, {id:'c', text:'a and b'}, {id:'d', text:'2a and 3b'} ], correct: 'a', exp_en: "Coefficients are numbers multiplying variables. Here, 2 (for a) and 3 (for b). -5 is a constant.", exp_id: "Koefisien adalah angka yang dikalikan dengan variabel. Di sini, 2 (untuk a) dan 3 (untuk b). -5 adalah konstanta." },
                    { id: 5, type: 'mcq', q: "Simplify: $2(x + 3) - 5$", q_id: "Sederhanakan: $2(x + 3) - 5$", options: [ {id:'a', text:'2x + 1'}, {id:'b', text:'2x - 2'}, {id:'c', text:'2x + 6'}, {id:'d', text:'2x + 11'} ], correct: 'a', exp_en: "Distribute 2: $2x + 6$. Then subtract 5: $2x + 1$.", exp_id: "Bagikan 2: $2x + 6$. Lalu kurang 5: $2x + 1$." },
                    { id: 6, type: 'mcq', q: "Write an expression: 'The difference between the square of a and the square of b'", q_id: "Tulis ekspresi: 'Selisih antara kuadrat a dan kuadrat b'", options: [ {id:'a', text:'a^2 - b^2'}, {id:'b', text:'(a - b)^2'}, {id:'c', text:'a^2 + b^2'}, {id:'d', text:'2a - 2b'} ], correct: 'a', exp_en: "Square of a is $a^2$, square of b is $b^2$. Difference means subtract: $a^2 - b^2$.", exp_id: "Kuadrat a adalah $a^2$, kuadrat b adalah $b^2$. Selisih berarti kurang: $a^2 - b^2$." },
                    { id: 7, type: 'input', q: "If one book costs 5000 and there is a discount of 2000, what is the expression for $n$ books?", q_id: "Jika satu buku seharga 5000 dan ada diskon 2000, berapakah ekspresi untuk $n$ buku?", correct: '5000n - 2000', exp_en: "n books cost 5000n. Minus the discount: 5000n - 2000.", exp_id: "n buku harganya 5000n. Dikurangi diskon: 5000n - 2000." },

        function renderAssignment(container, assignId, assignNum) {
            container.innerHTML = `

                </div>
            `;
            
            // Temporarily put assignment data into SectionData format for the renderer
            SectionData[assignId] = { exercises: AssignmentData[assignId] };
            
            const exContainer = document.getElementById(`exercises-${assignId}`);
            const nextSec = assignNum < 5 ? `assign${assignNum + 1}` : 'consolidation';
            
            SectionData[assignId].exercises.forEach((ex, i) => {
                exContainer.appendChild(createExerciseCard(assignId, ex, i, SectionData[assignId].exercises.length, nextSec));
            });
        }

        // ==========================================
        // PRINT ENGINE (A4 FORMAT)
        // ==========================================
        function printResult(assignId, assignNum) {
            const answers = AppData.progress[assignId].answers;
            const exercises = AssignmentData[assignId];
            let score = 0;
            
            let tableRows = '';
            exercises.forEach((ex, i) => {
                // Ambil jawaban siswa. Jika tidak ada, tampilkan '-'
                const userAnsRaw = answers[ex.id] || '-';
                let userAnsText = userAnsRaw;
                let correctAnsText = ex.correct;
                
                if (ex.type === 'mcq') {
                    const opt = ex.options.find(o => o.id === userAnsRaw);
                    if(opt) userAnsText = opt.text;
                    
                    const corrOpt = ex.options.find(o => o.id === ex.correct);
                    if(corrOpt) correctAnsText = corrOpt.text;
                }
                
                const isCorrect = answers[ex.id + '_correct'];
                if (isCorrect) score++;
                
                const qText = ex.q.replace(/\$/g, '');
                
                tableRows += `
                    <tr>
                        <td style="text-align: center; vertical-align: top;">${i + 1}</td>
                        <td style="vertical-align: top;">${qText}</td>
                        <td style="vertical-align: top;">${userAnsText}</td>
                        <td style="vertical-align: top;">${correctAnsText}</td>
                        <td style="text-align: center; vertical-align: top; font-size: 1.2rem;">${isCorrect ? '✓' : '✗'}</td>
                    </tr>
                `;
            });

            const printContent = `
                <div style="font-family: 'Arial', sans-serif; color: #000;">
                    <h1 style="text-align: center; margin-bottom: 5px;">MATH TUTORING by Deni</h1>

                            <td style="padding: 5px 0;"><strong>Date:</strong> .........................................</td>
                        </tr>
                        <tr>
                            <td style="padding: 5px 0;"><strong>Topic:</strong> Pythagorean Theorem (Basics)</td>
                            <td style="padding: 5px 0;"><strong>Assignment Group:</strong> Assignment ${assignNum}</td>
                        </tr>
                        <tr>
                            <td colspan="2" style="padding: 5px 0;"><strong>Score:</strong> ${score} / 10</td>
                        </tr>
                    </table>
                    
                    <table border="1" style="width: 100%; border-collapse: collapse; font-size: 12px;">
                        <thead>
                            <tr style="background-color: #f0f0f0;">
                                <th style="padding: 8px; width: 5%;">No.</th>
                                <th style="padding: 8px; width: 45%;">Question</th>
                                <th style="padding: 8px; width: 20%;">Student Answer</th>
                                <th style="padding: 8px; width: 20%;">Correct Answer</th>
                                <th style="padding: 8px; width: 10%;">Note</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                    
                    <div style="margin-top: 40px; text-align: right; padding-right: 50px;">
                        <p>Checked by,</p>
                        <br><br><br>
                        <p><strong>Deni</strong></p>
                    </div>
                </div>
            `;

            const printArea = document.getElementById('printArea');
            printArea.innerHTML = printContent;
            window.print();
        }
